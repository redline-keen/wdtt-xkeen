name: Проблема подключения
description: VPN, сервер, деплой, VKCalls, капча, DNS, WireGuard или пропал интернет.
title: "[Подключение]: "
labels:
  - connection
body:
  - type: markdown
    attributes:
      value: |
        Эта форма для проблем с подключением. Чем больше логов и контекста, тем быстрее получится понять причину.

        Issue будет виден всем. Не публикуйте пароли, ключи SSH/WireGuard, токены, VK-хеши и ссылки VK Звонков, полные ссылки подключения или другие секретные данные.

  - type: input
    id: app_version
    attributes:
      label: Версия WDTT Plus
      description: Посмотреть можно во вкладке «Инфо» → «О проекте».
      placeholder: "Например: 12"
    validations:
      required: true

  - type: dropdown
    id: apk_abi
    attributes:
      label: Какой APK установлен?
      options:
        - arm64-v8a
        - armeabi-v7a
        - x86_64
        - universal
        - Не знаю
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Телефон и Android
      placeholder: "Например: OnePlus 13, Android 15, OxygenOS"
    validations:
      required: true

  - type: dropdown
    id: profile_type
    attributes:
      label: Как добавлен профиль?
      options:
        - Собственный сервер, установленный через «Деплой»
        - Собственный сервер, настроенный вручную
        - Профиль импортирован или получен по ссылке
        - Ручная настройка подключения
        - Не знаю
    validations:
      required: true

  - type: checkboxes
    id: area
    attributes:
      label: Где проблема?
      options:
        - label: VPN не подключается
        - label: VPN подключился, но нет интернета
        - label: Проблема после сна телефона
        - label: Проблема после смены Wi‑Fi/LTE
        - label: VKCalls
        - label: Капча
        - label: Деплой сервера
        - label: Подключение импортированного или полученного профиля
        - label: Перенос сервера
        - label: Выходной IP / прокси / WireGuard exit
        - label: Другое
    validations:
      required: true

  - type: checkboxes
    id: network
    attributes:
      label: Сеть
      options:
        - label: Wi‑Fi
        - label: Мобильная сеть
        - label: Проблема повторяется в разных сетях
        - label: Проверялось только в одной сети
        - label: Не знаю
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Как часто повторяется?
      options:
        - При каждой попытке
        - Периодически
        - После сна телефона
        - После смены Wi‑Fi и мобильной сети
        - Произошло один раз
        - Не знаю
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Что происходит?
      description: Опишите проблему и когда она началась.
      placeholder: "Что нажимаете, что пишет приложение, на каком этапе всё ломается?"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Логи WDTT Plus
      description: Приложите относящийся к сбою фрагмент вкладки «Логи» или скриншот. Перед отправкой удалите секретные данные.
      render: text
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: Что уже пробовали?
      description: Например, остановить и заново включить VPN, сменить сеть, перезапустить приложение или сервер.
    validations:
      required: false

  - type: textarea
    id: server
    attributes:
      label: Информация о собственном сервере
      description: Заполните только для своего сервера и укажите то, что можно опубликовать.
      placeholder: |
        Новый деплой или старый сервер?
        ОС сервера, если знаете:
        Используется ли прокси/WireGuard exit:
        Менялись ли DNS/порты:
    validations:
      required: false

  - type: textarea
    id: server_diagnostics
    attributes:
      label: Диагностика собственного сервера из «Деплой»
      description: |
        Для проблем с собственным сервером: «Деплой» → «Установка на сервер» → значок лупы рядом с адресом сервера → «Скопировать отчёт».
        Отчёт может содержать адрес сервера, SSH-логин, порты и сведения о системе. Удалите всё, что не хотите показывать в публичном issue.
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Скриншоты
      description: Приложите скриншоты вкладок «Туннель», «Логи», «Деплой» или ошибок Android.
    validations:
      required: false

  - type: textarea
    id: support_report
    attributes:
      label: Отчёт о проверке устройства
      description: «Инфо» → «Действия» → «Проверить устройство» → «Скопировать отчёт».
      render: text
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка перед отправкой
      options:
        - label: Я проверил текст и вложения и удалил из них секретные данные.
          required: true
